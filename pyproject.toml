[project]
name = "oneos"
version = "0.1.0"
description = "Read-and-approve interface over a git-backed Markdown vault."
readme = "AGENTS.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "watchdog>=4.0",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
]

# Deps for later build steps (schema, ingest, outbox) are added in their own
# steps, per spec §10 — "do not build outside the current step".
[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Third-party: Starlette's TestClient warns during the httpx→httpx2
    # transition. Not our code; ignore this one message specifically.
    "ignore:Using `httpx` with `starlette.testclient`",
]
