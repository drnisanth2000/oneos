<div class="diff-panel">
  <h3 class="preview-title">Ready for your review</h3>
  <p>Proposed folder: <strong>{{ proposal.module }}</strong><br>
    Category: {{ proposal.sub or 'No category' }}</p>
  <p>Saved to Outbox; nothing moved yet.</p>
  <a class="review-link" href="/outbox/{{ proposal.entity }}">Review in Outbox</a>
  <details class="review-technical">
    <summary>Technical details</summary>
    <p>Proposal <code>{{ proposal.id }}</code></p>
    <pre class="diff-body">{{ diff }}</pre>
  </details>
</div>
